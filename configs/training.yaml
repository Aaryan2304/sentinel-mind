# Training configuration for LFM2.5-VL-450M fine-tuning
# Used by partner on RTX 4060 Ti or Colab T4

model:
  name: "LiquidAI/LFM2.5-VL-450M"
  dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./checkpoints/sentinel-mind"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  bf16: true
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  load_best_model_at_end: true
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0

dataset:
  # VRSBench (29,614 images, 123,221 VQA pairs) + custom spectral Q&A
  vrsbench: "xiang709/VRSBench"
  custom_spectral_qa: "data/custom/spectral_qa.jsonl"
  train_split: 0.9
  val_split: 0.1

hardware:
  # Partner's setup (update as needed)
  gpu: "RTX 4060 Ti"
  vram_gb: 16
  # Fallback
  fallback_gpu: "Colab T4"
  fallback_vram_gb: 16
